# yaml-language-server: $schema=./schema/sauron.schema.json
version: "1.0.0"

project:
  name: "typeforge"
  description: "TypeForge typing-test MPA - PHP 8 vanilla + MySQL PDO + Vanilla JS, XAMPP Apache"
  language: "php"
  framework: "none"

# VSCode-focused: only Copilot + OpenCode, rest disabled to avoid bloat
runtimes:
  claude: false
  cursor: false
  windsurf: false
  copilot: true
  cline: false
  trae: false
  zed: false
  codex: false
  gemini: false
  hermes: false
  kimi: false
  kiro: false
  openclaude: false
  opencode: true
  pi: false
  qwen: false
  adal: false
  codebuddy: false

# Fellowship: 4 core for TypeForge hardening
fellowship:
  gandalf:
    enabled: true
    role: "Master Planner and Strategy Guide"
    alias: ["planner", "lead"]
  aragorn:
    enabled: true
    role: "Principal System Architect"
    alias: ["architect", "design"]
  legolas:
    enabled: false
    role: "Precision Linter and Syntax Bug Hunter"
    alias: ["linter", "syntax"]
  gimli:
    enabled: false
    role: "Refactorer and AST Dead Code Slasher"
    alias: ["refactor", "cleanup"]
  boromir:
    enabled: true
    role: "Security Auditor and Shield"
    alias: ["security", "audit"]
  frodo:
    enabled: true
    role: "Core Task Executor and Ringbearer"
    alias: ["executor", "coder"]
  samwise:
    enabled: true
    role: "Git Commits and State Keeper"
    alias: ["commits", "git"]
  merry:
    enabled: true
    role: "QA and TDD Specialist"
    alias: ["tester", "tdd"]
  pippin:
    enabled: false
    role: "Edge Case and Chaos Prober"
    alias: ["fuzzer", "chaos"]

# Active Skill Domains for TypeForge P0
departments:
  architecture: true
  backend: true
  database: true
  devops: true
  frontend: true
  quality: true
  security: true
  workflow: false

settings:
  backup_existing: true
  dry_run: false
  anti_vibe_coding_strict_mode: true
  circuit_breaker_max_steps: 20
